
pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    mavenLocal()
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
  }
}

def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
  localPropsFile.withInputStream { localProps.load(it) }
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    maven {
      url 'https://maven.dddo.top:666/repository/maven-public/'
      credentials {
        username = localProps.getProperty('privateMavenUsername', '')
        password = localProps.getProperty('privateMavenPassword', '')
      }
    }
    maven { url 'https://jitpack.io' }
    maven {
      url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
    }
  }

  versionCatalogs {
    libs {
//      from("com.lyy.kpa.version:catalog:0.0.1")
      from(files('libs.versions.toml'))
      // 我们也可以重写覆盖catalog中的groovy版本
//      version("groovy", "3.0.6")
    }
  }

}

include ':app'
include('VersionManager')
rootProject.name='KeepassA-Lite'
include ':thrid:Sardine'
project(':thrid:Sardine').projectDir = file('thrid/Sardine')
include ':thrid:EasyProtector'
project(':thrid:EasyProtector').projectDir = file('thrid/EasyProtector')
